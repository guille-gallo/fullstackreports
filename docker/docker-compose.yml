services:
  mongodb:
    image: mongo:7
    container_name: fsr-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fsr-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: fsr-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/carreports
    depends_on:
      - mongodb
    networks:
      - fsr-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: fsr-frontend
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8080
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
    depends_on:
      - backend
    networks:
      - fsr-network

volumes:
  mongodb_data:

networks:
  fsr-network:
    driver: bridge
